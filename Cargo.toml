[package]
name = "Terralistic"
version = "0.5.2-alpha"
edition = "2021"
description = "Terralistic"
build = "build_main.rs"
license-file = "LICENSE"
repository = "https:://github.com/Zorz42/Terralistic"
keywords = ["game", "terralistic"]
categories = ["games", "graphics", "gui", "network-programming", "rendering"]

[[bin]]
name = "terralistic"
path = "main.rs"

[features]
# Golden-image tests for libraries/graphics. Off by default: they need a real GPU
# surface, which on macOS has to be created on the main thread, so they cannot run
# under `cargo test` (libtest always spawns a worker thread). Run them with
#   cargo run --features render-tests -- rendertest
# See libraries/graphics/render_tests.rs.
render-tests = []

[dependencies]
# login disabled: these are only used by the account client, see docs/LOGIN.md
# rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# webpki-roots = { version = "1.0", default-features = false }
# rustls-pki-types = { version = "1.1", default-features = false }
directories = { version = "6.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
rlua = { version = "0.20" }
anyhow = {version =  "1.0", default-features = false, features = ["std", "backtrace"] }
serde = { version = "1.0", default-features = false }
serde_derive = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
# The graphics backends are picked per target below. Asking for all three everywhere costs
# build time for two that can never run.
wgpu = { version = "30.0", default-features = false, features = ["std", "wgsl"] }
# The window and the input. `rwh_06` is what lets wgpu create a surface from the window
# without an unsafe raw-handle round trip; the x11/wayland pair is Linux only and both are
# loaded at runtime, so neither needs a system library at build time.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
pollster = { version = "1.0", default-features = false }
bytemuck = { version = "1.25", default-features = false, features = ["derive"] }
snap = { version = "1.1", default-features = false }
arboard = { version = "3.3", default-features = false }
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "thread_rng"] }
noise = { version = "0.9", default-features = false }
fnv = { version = "1.0", default-features = false }
ctrlc = { version = "3.5", default-features = false, features = ["termination"] }
hecs = { version = "0.11", default-features = false, features = ["std"] }
message-io = { version = "0.19", default-features = false, features = ["tcp"] }
# kvptree = { version = "0.1", default-features = false }

# One graphics backend per platform. wgpu already refuses to build a backend its target
# cannot use, so this does not change what runs - it stops `wgpu-core` compiling the plumbing
# for the other two.
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30.0", default-features = false, features = ["metal"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30.0", default-features = false, features = ["dx12", "vulkan"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wgpu = { version = "30.0", default-features = false, features = ["vulkan"] }

# What you play and iterate on. Deliberately no LTO: it costs 15% of the binary size but
# takes an incremental rebuild from 10s to 64s, and this is the profile you rebuild. Use
# `dist` to ship.
[profile.release]
strip = true
opt-level = 3
panic = "abort"

# What you ship. Same as release plus whole-program optimisation: 4.63 MB against release's
# 5.49 MB, for about 30s more on a clean build.
#   cargo build --profile dist
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1

# Optimised enough that the suite still runs in about two seconds, and no further.
#
# This used to be `opt-level = 3` with `lto = true` and `codegen-units = 1`, which meant
# every `cargo test` after a one line edit spent **62 seconds** relinking the world to run
# 385 tests that take two. At `opt-level = 1` the same edit rebuilds in 2s. Going to 0 builds
# just as fast but the tests themselves slow to 8s, because world generation is real work.
[profile.test]
opt-level = 1

[profile.dev]
strip = false
lto = false
codegen-units = 256
opt-level = 0

[build-dependencies]
# Only what the build script actually reaches: PNG -> .opa conversion, lua minification,
# and postcard+snap to write .mod files. It deliberately does NOT include the game's
# dependencies - see the module declarations in build_main.rs for why.
anyhow = { version = "1.0", features = ["std", "backtrace"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
darklua = "0.19"
png = { version = "0.18", default-features = false }
serde = { version = "1.0", default-features = false }
serde_derive = { version = "1.0", default-features = false }
snap = { version = "1.1", default-features = false }
winres = "0.1"




[package.metadata.bundle]
name = "Terralistic"
identifier = "com.Zorz42.Terralistic"
icon = ["resources/icon.icns"]
copyright = "Copyright (c) Zorz42 2022. All rights reserved."
category = "Game"
short_description = "Terralistic is a game."
long_description = """
Terralistic is a Terraria fan game.
It has some technical stuff that I miss in Terraria,
like: native mod support, good performance,
custom programming language for mods, online accounts,
good ui and so on...
"""
deb_depends = []
osx_frameworks = []
