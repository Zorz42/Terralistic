name: Rust

on:
   push:
     branches: [ "master", "beta-5" ]
   # no branch filter: a pull request against any branch gets checked, not just master
   pull_request:
   workflow_dispatch:

env:
   CARGO_TERM_COLOR: always

jobs:
   build:

     runs-on: ubuntu-latest

     steps:
     - uses: actions/checkout@v4
     - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
     - name: Rust Cache
       uses: Swatinem/rust-cache@v2
     - name: Check formatting
       run: cargo fmt --check
     # The tree is clippy clean, so any new warning fails the build. If this ever
     # becomes an obstacle, prefer a targeted #[allow] with a reason over dropping
     # -D warnings, since the lint list in main.rs is the main quality mechanism here.
     - name: Clippy
       run: cargo clippy --all-targets -- -D warnings
     - name: Run tests
       run: cargo test --verbose
     - name: Release build
       run: cargo build --release
